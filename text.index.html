<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAJA HUB - Private Cloud Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: '#0a0f1a',
                        card: '#111827',
                        primary: '#00f2ff',
                        'primary-foreground': '#0a0f1a',
                        border: '#1f2937',
                        input: '#151c2c',
                        muted: '#9ca3af',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'glow-primary': '0 0 20px rgba(0, 242, 255, 0.3)',
                        'glow-strong': '0 0 30px rgba(0, 242, 255, 0.5)',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0a0f1a; color: #f9fafb; }
        .text-glow { text-shadow: 0 0 20px rgba(0, 242, 255, 0.5); }
        .shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="hajaHub()" x-init="init()">

    <template x-if="!isLoggedIn">
        <div class="fixed inset-0 z-[100] flex items-center justify-center bg-background px-4">
            <div class="w-full max-w-md space-y-8 p-8 bg-card rounded-2xl border border-primary/30 shadow-glow-primary"
                 :class="{ 'shake': isShaking }">
                <div class="text-center space-y-2">
                    <div class="flex justify-center mb-4">
                        <div class="p-3 bg-primary/10 rounded-full">
                            <i data-lucide="lock" class="w-8 h-8 text-primary"></i>
                        </div>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tighter text-glow">HAJA HUB LOGIN</h1>
                    <p class="text-muted text-sm">Masukkan Password Akses</p>
                </div>

                <form @submit.prevent="handleLogin" class="space-y-4">
                    <input type="password" 
                           x-model="password"
                           placeholder="Password Disini..." 
                           class="w-full px-4 py-3 rounded-lg bg-input border border-border focus:border-primary focus:ring-1 focus:ring-primary outline-none text-center transition-all">
                    
                    <template x-if="error">
                        <div class="flex items-center justify-center gap-2 text-red-500 text-sm animate-pulse">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i>
                            <span>Password Salah!</span>
                        </div>
                    </template>

                    <button type="submit" 
                            class="w-full py-3 bg-primary text-primary-foreground font-bold rounded-lg hover:opacity-90 transition-opacity">
                        MASUK
                    </button>
                </form>

                <div class="flex items-center justify-center gap-2 text-muted text-xs">
                    <i data-lucide="shield" class="w-3 h-3"></i>
                    <span>Admin? Gunakan password admin</span>
                </div>
            </div>
        </div>
    </template>

    <template x-if="isLoggedIn">
        <div class="min-h-screen py-8 px-4" x-cloak>
            <div class="max-w-5xl mx-auto">
                
                <header class="text-center mb-8 relative">
                    <div class="absolute right-0 top-0 flex items-center gap-2">
                        <template x-if="isAdmin">
                            <span class="inline-flex items-center gap-1 px-3 py-1 bg-primary/20 text-primary text-xs font-bold rounded-full">
                                <i data-lucide="shield" class="w-3 h-3"></i> ADMIN
                            </span>
                        </template>
                        <button @click="handleLogout" class="flex items-center gap-2 px-3 py-1.5 border border-border rounded-lg hover:bg-white/5 transition-colors text-sm">
                            <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                        </button>
                    </div>

                    <div class="inline-flex items-center gap-3 mb-4">
                        <i data-lucide="sparkles" class="w-8 h-8 text-primary"></i>
                        <h1 class="text-3xl md:text-4xl font-bold text-primary text-glow uppercase">WELCOME, HAJA HUB</h1>
                        <i data-lucide="sparkles" class="w-8 h-8 text-primary"></i>
                    </div>
                    <p class="text-muted">Koleksi Script Private Kamu (Synced via Cloud)</p>
                </header>

                <div class="flex flex-col sm:flex-row gap-4 mb-8">
                    <div class="relative flex-1">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-muted"></i>
                        <input type="text" 
                               x-model="searchQuery"
                               placeholder="Cari script..." 
                               class="w-full pl-12 pr-4 py-3 bg-card border border-border rounded-xl focus:border-primary outline-none">
                    </div>
                    <template x-if="isAdmin">
                        <button @click="openAddModal" class="flex items-center justify-center gap-2 px-6 py-3 bg-primary text-primary-foreground font-bold rounded-xl hover:shadow-glow-primary transition-all">
                            <i data-lucide="plus" class="w-5 h-5"></i> TAMBAH SCRIPT
                        </button>
                    </template>
                </div>

                <div x-show="isLoading" class="flex flex-col items-center justify-center py-20 gap-4 text-primary">
                    <div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
                    <p class="animate-pulse">Sinkronisasi Cloud...</p>
                </div>

                <div x-show="!isLoading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                    <template x-for="script in filteredScripts()" :key="script.id">
                        <div class="bg-card rounded-2xl border border-border overflow-hidden hover:border-primary/50 transition-all duration-300 group">
                            <div class="relative h-40 bg-gray-800 overflow-hidden">
                                <img :src="script.image || 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&h=300&fit=crop'" 
                                     class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                                <div class="absolute inset-0 bg-gradient-to-t from-card/80 to-transparent"></div>
                                
                                <template x-if="isAdmin">
                                    <div class="absolute top-2 right-2 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                        <button @click="openEditModal(script)" class="p-2 bg-card/90 rounded-lg hover:bg-primary hover:text-primary-foreground">
                                            <i data-lucide="pencil" class="w-4 h-4"></i>
                                        </button>
                                        <button @click="deleteScript(script.id)" class="p-2 bg-card/90 rounded-lg hover:bg-red-600 hover:text-white">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </template>
                            </div>

                            <div class="p-4 space-y-3">
                                <h3 class="font-semibold text-white" x-text="script.title"></h3>
                                <div class="bg-[#050a14] p-3 rounded-lg overflow-hidden">
                                    <code class="text-xs font-mono text-emerald-500 break-all line-clamp-2" x-text="script.code"></code>
                                </div>
                                <button @click="copyToClipboard(script.code, $el)" 
                                        class="w-full flex items-center justify-center gap-2 py-2.5 bg-white/5 hover:bg-primary hover:text-primary-foreground rounded-lg font-medium transition-all">
                                    <i data-lucide="copy" class="w-4 h-4"></i>
                                    <span>COPY</span>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="!isLoading && filteredScripts().length === 0" class="text-center py-16 text-muted">
                    <p x-text="scripts.length === 0 ? 'Belum ada script di cloud.' : 'Tidak ada script yang cocok.'"></p>
                </div>

                <footer class="text-center mt-16 py-8 border-t border-border">
                    <p class="text-muted text-sm">© 2026 Haja Hub. Private Script Library.</p>
                </footer>
            </div>
        </div>
    </template>

    <div x-show="isModalOpen" 
         class="fixed inset-0 z-[110] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4"
         x-transition x-cloak>
        <div class="relative w-full max-w-md p-6 bg-card rounded-2xl border border-primary/30 shadow-glow-strong" @click.outside="isModalOpen = false">
            <button @click="isModalOpen = false" class="absolute top-4 right-4 text-muted hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>

            <h2 class="text-xl font-bold text-primary mb-6" x-text="editingId ? 'Edit Script' : 'Tambah Script Baru'"></h2>

            <form @submit.prevent="saveScript" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Nama Script</label>
                    <input type="text" x-model="modalData.title" required
                           class="w-full px-4 py-2 bg-input border border-border rounded-lg focus:border-primary outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">Kode Script</label>
                    <textarea x-model="modalData.code" required
                              class="w-full px-4 py-2 bg-input border border-border rounded-lg focus:border-primary outline-none font-mono text-sm min-h-[100px]"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-2">URL Gambar (Opsional)</label>
                    <input type="url" x-model="modalData.image"
                           placeholder="https://..."
                           class="w-full px-4 py-2 bg-input border border-border rounded-lg focus:border-primary outline-none">
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" @click="isModalOpen = false" class="flex-1 py-2 border border-border rounded-lg hover:bg-white/5">BATAL</button>
                    <button type="submit" 
                            :disabled="isSyncing"
                            class="flex-1 py-2 bg-primary text-primary-foreground font-bold rounded-lg hover:opacity-90 disabled:opacity-50">
                        <span x-text="isSyncing ? 'MENGIRIM...' : 'SIMPAN'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- KONFIGURASI KAMU ---
        const BIN_ID = '6986e98eae596e708f17b9bc';
        const MASTER_KEY = '$2a$10$c0v.0uwUt/MnX.Sf4iS4Xuchs8/BfTBhQNJWOrhuMz1fUXghakM4S';

        function hajaHub() {
            return {
                isLoggedIn: false,
                isAdmin: false,
                password: '',
                error: false,
                isShaking: false,
                searchQuery: '',
                scripts: [],
                isModalOpen: false,
                isLoading: false,
                isSyncing: false,
                editingId: null,
                modalData: { title: '', code: '', image: '' },

                async init() {
                    if (sessionStorage.getItem("isLoggedIn") === "true") {
                        this.isLoggedIn = true;
                        this.isAdmin = sessionStorage.getItem("isAdmin") === "true";
                        await this.fetchCloudData();
                    }
                    this.$nextTick(() => lucide.createIcons());
                },

                handleLogin() {
                    const USER_PW = "HajaHuballscript";
                    const ADMIN_PW = "HajaHubAdmin123";

                    if (this.password === ADMIN_PW) {
                        this.loginSuccess(true);
                    } else if (this.password === USER_PW) {
                        this.loginSuccess(false);
                    } else {
                        this.error = true;
                        this.isShaking = true;
                        this.password = '';
                        setTimeout(() => { this.isShaking = false; }, 500);
                    }
                },

                async loginSuccess(admin) {
                    this.isLoggedIn = true;
                    this.isAdmin = admin;
                    sessionStorage.setItem("isLoggedIn", "true");
                    sessionStorage.setItem("isAdmin", admin ? "true" : "false");
                    await this.fetchCloudData();
                    this.$nextTick(() => lucide.createIcons());
                },

                async fetchCloudData() {
                    this.isLoading = true;
                    try {
                        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                            headers: { 'X-Master-Key': MASTER_KEY }
                        });
                        const result = await response.json();
                        this.scripts = result.record.scripts || [];
                    } catch (error) {
                        console.error("Gagal mengambil data:", error);
                        alert("Gagal koneksi ke Cloud Database!");
                    } finally {
                        this.isLoading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                async syncToCloud() {
                    this.isSyncing = true;
                    try {
                        await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Master-Key': MASTER_KEY
                            },
                            body: JSON.stringify({ scripts: this.scripts })
                        });
                    } catch (error) {
                        alert("Gagal sinkronisasi data ke Cloud!");
                    } finally {
                        this.isSyncing = false;
                    }
                },

                handleLogout() {
                    sessionStorage.clear();
                    location.reload();
                },

                filteredScripts() {
                    if (!this.searchQuery) return this.scripts;
                    const q = this.searchQuery.toLowerCase();
                    return this.scripts.filter(s => 
                        s.title.toLowerCase().includes(q)
                    );
                },

                openAddModal() {
                    this.editingId = null;
                    this.modalData = { title: '', code: '', image: '' };
                    this.isModalOpen = true;
                },

                openEditModal(script) {
                    this.editingId = script.id;
                    this.modalData = { ...script };
                    this.isModalOpen = true;
                },

                async saveScript() {
                    if (this.editingId) {
                        this.scripts = this.scripts.map(s => 
                            s.id === this.editingId ? { ...this.modalData, id: s.id } : s
                        );
                    } else {
                        const newScript = {
                            ...this.modalData,
                            id: Date.now().toString(),
                            image: this.modalData.image || "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?w=600&h=300&fit=crop"
                        };
                        this.scripts.unshift(newScript);
                    }
                    
                    await this.syncToCloud();
                    this.isModalOpen = false;
                    this.$nextTick(() => lucide.createIcons());
                },

                async deleteScript(id) {
                    if (confirm("Hapus script ini dari Cloud Database?")) {
                        this.scripts = this.scripts.filter(s => s.id !== id);
                        await this.syncToCloud();
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                async copyToClipboard(text, el) {
                    await navigator.clipboard.writeText(text);
                    const originalHTML = el.innerHTML;
                    el.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> <span>COPIED</span>`;
                    el.classList.add('bg-emerald-500', 'text-white');
                    lucide.createIcons();
                    
                    setTimeout(() => {
                        el.innerHTML = originalHTML;
                        el.classList.remove('bg-emerald-500', 'text-white');
                        lucide.createIcons();
                    }, 2000);
                }
            }
        }
    </script>
</body>
</html>
